<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Field Reading</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #17130F;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .page {
    width: 100%;
    max-width: 420px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    color: #8FB542;
    margin-bottom: 18px;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.2;
    color: #F1EDE1;
    margin-bottom: 14px;
  }
  h1 span { color: #8FB542; }

  .lede {
    font-size: 14px;
    line-height: 1.7;
    color: #9C9A90;
    margin-bottom: 32px;
  }

  .frame {
    position: relative;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 28px 24px;
    background: rgba(255,255,255,0.015);
  }

  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
  }
  .frame::before {
    top: -1px; left: -1px;
    border-top: 1.5px solid rgba(241,237,225,0.35);
    border-left: 1.5px solid rgba(241,237,225,0.35);
  }
  .frame::after {
    top: -1px; right: -1px;
    border-top: 1.5px solid rgba(241,237,225,0.35);
    border-right: 1.5px solid rgba(241,237,225,0.35);
  }
  .frame .br-bl {
    position: absolute; bottom: -1px; left: -1px;
    width: 18px; height: 18px;
    border-bottom: 1.5px solid rgba(241,237,225,0.35);
    border-left: 1.5px solid rgba(241,237,225,0.35);
  }
  .frame .br-br {
    position: absolute; bottom: -1px; right: -1px;
    width: 18px; height: 18px;
    border-bottom: 1.5px solid rgba(241,237,225,0.35);
    border-right: 1.5px solid rgba(241,237,225,0.35);
  }

  .field-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #6B6A60;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .field { margin-bottom: 20px; }

  .field input {
    width: 100%;
    padding: 12px 14px;
    background: #0F0C09;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    font-size: 15px;
    color: #F1EDE1;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input::placeholder { color: #4A4944; }
  .field input:focus {
    border-color: #8FB542;
    box-shadow: 0 0 0 3px rgba(143, 181, 66, 0.12);
  }
  .field .hint {
    font-size: 11.5px;
    color: #6B6A60;
    margin-top: 6px;
  }

  .password-wrap {
    position: relative;
  }
  .password-wrap input {
    padding-right: 44px;
  }
  .toggle-password {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #6B6A60;
    padding: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .toggle-password:hover { color: #9C9A90; }
  .toggle-password svg { display: block; }
  .toggle-password .eye-off { display: none; }
  .toggle-password.showing .eye { display: none; }
  .toggle-password.showing .eye-off { display: block; }

  .error-msg {
    font-size: 12.5px;
    color: #E29A5A;
    margin: -10px 0 16px;
    line-height: 1.5;
  }

  .submit-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 3px;
    background: #8FB542;
    color: #17130F;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .submit-btn:hover { background: #A0C956; }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: #4A4944;
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  .google-btn {
    width: 100%;
    padding: 12px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent;
    color: #F1EDE1;
    font-size: 14px;
    cursor: pointer;
  }
  .google-btn:hover { background: rgba(255,255,255,0.03); }

  .login-line {
    text-align: center;
    margin-top: 26px;
    font-size: 13px;
    color: #6B6A60;
  }
  .login-line a {
    color: #8FB542;
    text-decoration: none;
  }
  .login-line a:hover { text-decoration: underline; }
</style>
</head>
<body>

  <div class="page">
    <p class="eyebrow mono">FIELD READING</p>
    <h1>Start reading<br />your <span>fields.</span></h1>
    <p class="lede mono">Create an account to track soil readings across every plot you check.</p>

    <div class="frame">
      <div class="br-bl"></div>
      <div class="br-br"></div>

      <form id="signupForm">
        <div class="field">
          <p class="field-label mono">Username</p>
          <input type="text" id="username" placeholder="fieldname" required minlength="3" maxlength="20" autocomplete="username" />
          <p class="hint mono">3–20 characters. Letters, numbers, underscores only.</p>
        </div>

        <div class="field">
          <p class="field-label mono">Email</p>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="field">
          <p class="field-label mono">Password</p>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <svg class="eye" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
              <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c7 0 10.5 7 10.5 7a13.2 13.2 0 0 1-3.1 3.9M6.6 6.6C3.4 8.8 1.5 12 1.5 12S5 19 12 19c1.4 0 2.6-.3 3.7-.7M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <p class="hint mono">At least 6 characters.</p>
        </div>

        <p class="error-msg mono" id="errorMsg" style="display:none;"></p>

        <button type="submit" class="submit-btn" id="submitBtn">Create account</button>
      </form>

      <div class="divider mono">OR</div>

      <button type="button" class="google-btn" id="googleBtn">Continue with Google</button>
    </div>

    <p class="login-line mono">Already have an account? <a href="index.html">Log in</a></p>
  </div>

  <script src="config.js"></script>
  <!-- Supabase (JS client v2 via CDN) -->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    const form = document.getElementById("signupForm");
    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");
    const googleBtn = document.getElementById("googleBtn");
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    const REDIRECT_URL = "profile.html";
    const USERNAME_RE = /^[a-zA-Z0-9_]{3,20}$/;

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = "block";
    }
    function clearError() {
      errorMsg.style.display = "none";
      errorMsg.textContent = "";
    }

    // Calls the is_username_taken() Postgres function instead of
    // selecting straight from profiles, so anon visitors can check
    // availability without a broad public SELECT policy.
    async function isUsernameTaken(usernameLower) {
      const { data, error } = await supabase.rpc("is_username_taken", { uname: usernameLower });
      if (error) {
        console.error(error);
        return false; // fail open on the client — the DB unique index is the real guard
      }
      return !!data;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !email || !password) {
        showError("Enter a username, email, and password.");
        return;
      }
      if (!USERNAME_RE.test(username)) {
        showError("Username must be 3–20 characters: letters, numbers, or underscores.");
        return;
      }
      if (password.length < 6) {
        showError("Password must be at least 6 characters.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      try {
        const taken = await isUsernameTaken(username.toLowerCase());
        if (taken) {
          showError("That username is already taken.");
          return;
        }

        // The username goes into user_metadata here; a database
        // trigger (handle_new_user, see the SQL schema notes) reads
        // it and creates the matching profiles row server-side —
        // that way it exists even before the user confirms their
        // email. Supabase also sends the confirmation email itself,
        // so there's no separate "send verification" call needed.
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { username },
            emailRedirectTo: window.location.origin + "/index.html",
          },
        });
        if (error) throw error;

        if (data.session) {
          // Email confirmation is off for this project — the user is
          // signed in immediately.
          window.location.href = REDIRECT_URL;
        } else {
          // Default Supabase behavior: no session until they confirm.
          showError("Account created — check your email to verify, then log in.");
          setTimeout(() => { window.location.href = "index.html"; }, 2500);
        }
      } catch (err) {
        console.error(err);
        showError(friendlyError(err));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });

    googleBtn.addEventListener("click", async () => {
      clearError();
      // Redirect-based like the login page's Google button — a
      // profiles row is created automatically by the same trigger,
      // with a username derived from the Google profile.
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + "/" + REDIRECT_URL },
      });
      if (error) {
        console.error("Google sign-in error:", error);
        showError(friendlyError(error));
      }
    });

    togglePassword.addEventListener("click", () => {
      const isShowing = passwordInput.type === "text";
      passwordInput.type = isShowing ? "password" : "text";
      togglePassword.classList.toggle("showing", !isShowing);
      togglePassword.setAttribute("aria-label", isShowing ? "Show password" : "Hide password");
    });

    function friendlyError(err) {
      const msg = (err && err.message) || "";
      const lower = msg.toLowerCase();
      if (lower.includes("already registered") || lower.includes("already exists")) return "An account already exists with that email.";
      if (lower.includes("invalid email")) return "That email address doesn't look right.";
      if (lower.includes("password") && (lower.includes("weak") || lower.includes("at least") || lower.includes("should be"))) return "Password is too weak — use at least 6 characters.";
      if (lower.includes("popup closed") || lower.includes("cancelled")) return "Google sign-in was closed before finishing.";
      if (lower.includes("provider is not enabled") || lower.includes("unsupported provider")) return "Google sign-in isn't enabled yet — turn it on under Authentication > Providers in your Supabase project.";
      if (lower.includes("invalid api key")) return "The Supabase anon key in config.js isn't valid — double check it against your Supabase project settings.";
      if (lower.includes("failed to fetch")) return "Couldn't reach Supabase — check SUPABASE_URL in config.js and your connection.";
      return msg || "Something went wrong. Please try again.";
    }
  </script>

</body>
</html>
