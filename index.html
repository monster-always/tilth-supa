<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Field Reading</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #17130F;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .page {
    width: 100%;
    max-width: 420px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    color: #8FB542;
    margin-bottom: 18px;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.2;
    color: #F1EDE1;
    margin-bottom: 14px;
  }
  h1 span { color: #8FB542; }

  .lede {
    font-size: 14px;
    line-height: 1.7;
    color: #9C9A90;
    margin-bottom: 32px;
  }

  .frame {
    position: relative;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 28px 24px;
    background: rgba(255,255,255,0.015);
  }

  /* camera-viewfinder corner brackets, echoing the reference screenshot */
  .frame::before, .frame::after,
  .frame .br-tl, .frame .br-br {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border-color: rgba(241,237,225,0.35);
  }
  .frame::before {
    top: -1px; left: -1px;
    border-top: 1.5px solid rgba(241,237,225,0.35);
    border-left: 1.5px solid rgba(241,237,225,0.35);
  }
  .frame::after {
    top: -1px; right: -1px;
    border-top: 1.5px solid rgba(241,237,225,0.35);
    border-right: 1.5px solid rgba(241,237,225,0.35);
  }
  .frame .br-bl {
    position: absolute; bottom: -1px; left: -1px;
    width: 18px; height: 18px;
    border-bottom: 1.5px solid rgba(241,237,225,0.35);
    border-left: 1.5px solid rgba(241,237,225,0.35);
  }
  .frame .br-br {
    bottom: -1px; right: -1px;
    border-bottom: 1.5px solid rgba(241,237,225,0.35);
    border-right: 1.5px solid rgba(241,237,225,0.35);
  }

  .field-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #6B6A60;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .field { margin-bottom: 20px; }

  .field input {
    width: 100%;
    padding: 12px 14px;
    background: #0F0C09;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    font-size: 15px;
    color: #F1EDE1;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input::placeholder { color: #4A4944; }
  .field input:focus {
    border-color: #8FB542;
    box-shadow: 0 0 0 3px rgba(143, 181, 66, 0.12);
  }

  .password-wrap {
    position: relative;
  }
  .password-wrap input {
    padding-right: 44px;
  }
  .toggle-password {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #6B6A60;
    padding: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .toggle-password:hover { color: #9C9A90; }
  .toggle-password svg { display: block; }
  .toggle-password .eye-off { display: none; }
  .toggle-password.showing .eye { display: none; }
  .toggle-password.showing .eye-off { display: block; }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 26px;
    font-size: 13px;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #9C9A90;
  }
  .checkbox-row input { width: 14px; height: 14px; accent-color: #8FB542; }

  .forgot-link {
    color: #8FB542;
    text-decoration: none;
  }
  .forgot-link:hover { text-decoration: underline; }

  .submit-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 3px;
    background: #8FB542;
    color: #17130F;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .submit-btn:hover { background: #A0C956; }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }

  .error-msg {
    font-size: 12.5px;
    color: #E29A5A;
    margin: -10px 0 16px;
    line-height: 1.5;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: #4A4944;
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  .google-btn {
    width: 100%;
    padding: 12px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent;
    color: #F1EDE1;
    font-size: 14px;
    cursor: pointer;
  }
  .google-btn:hover { background: rgba(255,255,255,0.03); }

  .signup-line {
    text-align: center;
    margin-top: 26px;
    font-size: 13px;
    color: #6B6A60;
  }
  .signup-line a {
    color: #8FB542;
    text-decoration: none;
  }
  .signup-line a:hover { text-decoration: underline; }

  .verify-banner {
    display: none;
    margin-top: 18px;
    padding: 14px 16px;
    border: 1px solid rgba(226,154,90,0.35);
    background: rgba(226,154,90,0.08);
    border-radius: 3px;
  }
  .verify-banner p {
    font-size: 12.5px;
    line-height: 1.6;
    color: #E29A5A;
    margin-bottom: 10px;
  }
  .verify-banner-actions {
    display: flex;
    gap: 10px;
  }
  .verify-banner-actions button {
    flex: 1;
    padding: 9px;
    border-radius: 3px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  #resendLoginBtn {
    background: transparent;
    border: 1px solid #E29A5A;
    color: #E29A5A;
  }
  #resendLoginBtn:hover { background: rgba(226,154,90,0.1); }
  #resendLoginBtn:disabled { opacity: 0.5; cursor: default; }
  #continueAnywayBtn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: #9C9A90;
  }
  #continueAnywayBtn:hover { background: rgba(255,255,255,0.03); }
</style>
</head>
<body>

  <div class="page">
    <p class="eyebrow mono">FIELD READING</p>
    <h1>Get back to<br />your <span>fields.</span></h1>
    <p class="lede mono">Log in to keep reading soil texture, condition, and crop fit — right where you left off.</p>

    <div class="frame">
      <div class="br-bl"></div>
      <div class="br-br"></div>

      <form id="loginForm">
        <div class="field">
          <p class="field-label mono">Username or Email</p>
          <input type="text" id="identifier" placeholder="username or you@example.com" required autocomplete="username" />
        </div>

        <div class="field">
          <p class="field-label mono">Password</p>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <svg class="eye" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
              <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c7 0 10.5 7 10.5 7a13.2 13.2 0 0 1-3.1 3.9M6.6 6.6C3.4 8.8 1.5 12 1.5 12S5 19 12 19c1.4 0 2.6-.3 3.7-.7M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <div class="row-between mono">
          <label class="checkbox-row">
            <input type="checkbox" />
            Remember me
          </label>
          <a href="#" class="forgot-link" id="forgotLink">Forgot?</a>
        </div>

        <p class="error-msg mono" id="errorMsg" style="display:none;"></p>

        <button type="submit" class="submit-btn" id="submitBtn">Log in</button>
      </form>

      <div class="verify-banner mono" id="verifyBanner">
        <p id="verifyBannerText">Your email isn't verified yet. Check your inbox for the link we sent when you signed up.</p>
        <div class="verify-banner-actions">
          <button type="button" id="resendLoginBtn">Resend email</button>
          <button type="button" id="continueAnywayBtn">Continue anyway</button>
        </div>
      </div>

      <div class="divider mono">OR</div>

      <button type="button" class="google-btn" id="googleBtn">Continue with Google</button>
    </div>

    <p class="signup-line mono">No account? <a href="signup.html">Sign up</a></p>
  </div>

  <script src="config.js"></script>
  <!-- Supabase (JS client v2 via CDN) -->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");
    const googleBtn = document.getElementById("googleBtn");
    const forgotLink = document.getElementById("forgotLink");
    const verifyBanner = document.getElementById("verifyBanner");
    const resendLoginBtn = document.getElementById("resendLoginBtn");
    const continueAnywayBtn = document.getElementById("continueAnywayBtn");
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");

    let pendingUnverifiedUser = null;

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.style.display = "block";
    }
    function clearError() {
      errorMsg.style.display = "none";
      errorMsg.textContent = "";
    }

    // Where to send the user after a successful login.
    // Change this to your app's main page.
    const REDIRECT_URL = "profile.html";

    // Given whatever the user typed, resolve it to an email address.
    // If it already looks like an email, use it as-is. Otherwise, treat
    // it as a username and look it up via the get_email_by_username
    // Postgres function (see the SQL schema notes) rather than
    // querying the profiles table directly, so anon visitors can
    // resolve a login email without a broad public SELECT policy.
    async function resolveEmail(identifier) {
      if (identifier.includes("@")) {
        return identifier;
      }
      const { data, error } = await supabase.rpc("get_email_by_username", {
        uname: identifier.toLowerCase(),
      });
      if (error) {
        console.error(error);
        return null;
      }
      return data || null;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();
      verifyBanner.style.display = "none";
      pendingUnverifiedUser = null;

      const identifier = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;

      if (!identifier || !password) {
        showError("Enter your username/email and password.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      try {
        const email = await resolveEmail(identifier);
        if (!email) {
          showError("Account not created.");
          return;
        }

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const user = data.user;
        const isPasswordAccount = (user.identities || []).some((i) => i.provider === "email");

        if (isPasswordAccount && !user.email_confirmed_at) {
          // Supabase still returns a valid session here (unlike Firebase,
          // which we're matching by *not* blocking the sign-in) — just
          // nag them to verify instead of forcing it.
          pendingUnverifiedUser = user;
          verifyBanner.style.display = "block";
          return;
        }

        window.location.href = REDIRECT_URL;
      } catch (err) {
        console.error(err);
        showError(friendlyError(err));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });

    googleBtn.addEventListener("click", async () => {
      clearError();
      verifyBanner.style.display = "none";
      pendingUnverifiedUser = null;
      // Supabase's Google sign-in is redirect-based (no popup): the
      // browser leaves this page, and comes back to REDIRECT_URL with
      // a session already established. A new profiles row is created
      // automatically server-side (see the handle_new_user trigger).
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + "/" + REDIRECT_URL },
      });
      if (error) {
        console.error("Google sign-in error:", error);
        showError(friendlyError(error));
      }
    });

    resendLoginBtn.addEventListener("click", async () => {
      if (!pendingUnverifiedUser) return;
      resendLoginBtn.disabled = true;

      try {
        const { error } = await supabase.auth.resend({
          type: "signup",
          email: pendingUnverifiedUser.email,
        });
        if (error) throw error;
        document.getElementById("verifyBannerText").textContent =
          "Verification email sent — check your inbox.";

        let secondsLeft = 60;
        resendLoginBtn.textContent = `Resend in ${secondsLeft}s`;
        const interval = setInterval(() => {
          secondsLeft -= 1;
          if (secondsLeft <= 0) {
            clearInterval(interval);
            resendLoginBtn.textContent = "Resend email";
            resendLoginBtn.disabled = false;
          } else {
            resendLoginBtn.textContent = `Resend in ${secondsLeft}s`;
          }
        }, 1000);
      } catch (err) {
        console.error(err);
        document.getElementById("verifyBannerText").textContent = friendlyError(err);
        resendLoginBtn.disabled = false;
      }
    });

    continueAnywayBtn.addEventListener("click", () => {
      window.location.href = REDIRECT_URL;
    });

    togglePassword.addEventListener("click", () => {
      const isShowing = passwordInput.type === "text";
      passwordInput.type = isShowing ? "password" : "text";
      togglePassword.classList.toggle("showing", !isShowing);
      togglePassword.setAttribute("aria-label", isShowing ? "Show password" : "Hide password");
    });

    forgotLink.addEventListener("click", async (e) => {
      e.preventDefault();
      clearError();
      const identifier = document.getElementById("identifier").value.trim();
      if (!identifier) {
        showError("Enter your username or email above first, then click Forgot.");
        return;
      }
      try {
        const email = await resolveEmail(identifier);
        if (!email) {
          showError("Account not created.");
          return;
        }
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/index.html",
        });
        if (error) throw error;
        showError("Password reset email sent — check your inbox.");
      } catch (err) {
        console.error(err);
        showError(friendlyError(err));
      }
    });

    // Supabase (unlike Firebase) doesn't host its own "set a new
    // password" page — the reset link above lands back on index.html
    // with a recovery session, and this listener catches that moment.
    // It's a bare-bones prompt() so the flow actually works end to
    // end; swap in a nicer inline form whenever you get to it.
    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        const newPassword = window.prompt("Enter a new password (at least 6 characters):");
        if (newPassword && newPassword.length >= 6) {
          supabase.auth.updateUser({ password: newPassword }).then(({ error }) => {
            showError(error ? friendlyError(error) : "Password updated — you can log in now.");
          });
        }
      }
    });

    function friendlyError(err) {
      const msg = (err && err.message) || "";
      const lower = msg.toLowerCase();
      if (lower.includes("invalid login credentials")) return "Incorrect username/email or password.";
      if (lower.includes("email not confirmed")) return "Please verify your email before logging in.";
      if (lower.includes("rate limit") || lower.includes("too many requests")) return "Too many attempts. Try again in a bit.";
      if (lower.includes("popup closed") || lower.includes("cancelled")) return "Google sign-in was closed before finishing.";
      if (lower.includes("provider is not enabled") || lower.includes("unsupported provider")) return "Google sign-in isn't enabled yet — turn it on under Authentication > Providers in your Supabase project.";
      if (lower.includes("invalid api key")) return "The Supabase anon key in config.js isn't valid — double check it against your Supabase project settings.";
      if (lower.includes("failed to fetch")) return "Couldn't reach Supabase — check SUPABASE_URL in config.js and your connection.";
      return msg || "Something went wrong. Please try again.";
    }
  </script>

</body>
</html>
